<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>EDTO CRZ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="screen-title">CRZ</h1>
  </header>

  <main id="app">
    <section class="screen" id="screen-crz" data-tab="crz" aria-labelledby="tab-crz">
      <div class="card">
        <h2>Cruise</h2>
        <p class="muted">Cruise calculations go here.</p>
      </div>
    </section>

    <section class="screen" id="screen-edto" data-tab="edto" aria-labelledby="tab-edto" hidden>
      <div class="card">
        <h2>EDTO</h2>
        <p class="muted">EDTO calculations go here.</p>
      </div>
    </section>

    <section class="screen" id="screen-app" data-tab="app" aria-labelledby="tab-app" hidden>
      <div class="card">
        <h2>Approach</h2>
        <p class="muted">Approach calculations go here.</p>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" role="tablist" aria-label="Main">
    <button class="tab" id="tab-crz" role="tab" data-tab="crz" aria-controls="screen-crz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      <span>CRZ</span>
    </button>
    <button class="tab" id="tab-edto" role="tab" data-tab="edto" aria-controls="screen-edto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 0 1 7.75 6H13V4.07c-.33-.04-.66-.07-1-.07zm-1 .07V11h6.93A8 8 0 1 1 11 4.07z"/></svg>
      <span>EDTO</span>
    </button>
    <button class="tab" id="tab-app" role="tab" data-tab="app" aria-controls="screen-app">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18v2H3zM11 2h2v4h-2zm1 6 7 10H5z"/></svg>
      <span>APP</span>
    </button>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
